name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm run coverage
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Browser end-to-end (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Uses the Google Chrome preinstalled on the runner; no browser download.
      - run: npm run test:e2e
        env:
          E2E_BROWSER_CHANNEL: chrome
      # Agent kit loop on the example project (CLI, scoped token, Excel answer, restart, browser check).
      - run: npm run demo:agent
        env:
          E2E_BROWSER_CHANNEL: chrome
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          retention-days: 14

  docker:
    name: Docker image and deploy scripts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Builds the image, then clean and demo deployment, health, backup, upgrade, rollback, restore and reset
      # (with their confirmation guards) in an isolated loopback-only instance.
      - run: bash deploy/test-deploy.sh
