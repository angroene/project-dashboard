# Status: tested on linux/amd64 and linux/arm64 (deploy/test-deploy.sh, in CI on both).
# Setup steps: docs/DEPLOYMENT.md, section "Docker Compose".
#
# Defaults are the safe ones:
#   - the port is published on the host's loopback address only (change PCC_BIND to expose it deliberately)
#   - login is required (PCC_AUTH_MODE=required); a token file and a TLS certificate and key are required, supplied
#     as Compose secrets
#   - scoped agent tokens come from secrets/agent_tokens.json (hashes only); the deploy script creates it empty
#   - project data lives in the named volume "pcc-data", mounted at /data inside the container
services:
  dashboard:
    build: .
    image: ${APD_IMAGE:-agents-project-dashboard:local}
    init: true
    restart: unless-stopped
    ports:
      - "${PCC_BIND:-127.0.0.1}:${PCC_HOST_PORT:-8790}:8790"
    environment:
      PCC_TLS_CERT: /run/secrets/pcc_tls_cert
      PCC_TLS_KEY: /run/secrets/pcc_tls_key
      # Dashboard login (docs/DEPLOYMENT.md, "Login modes"). Empty values keep the defaults: login required, no
      # trusted networks, no trusted proxies.
      PCC_AUTH_MODE: ${PCC_AUTH_MODE:-required}
      PCC_TRUSTED_NETWORKS: ${PCC_TRUSTED_NETWORKS:-}
      PCC_TRUSTED_PROXIES: ${PCC_TRUSTED_PROXIES:-}
      PCC_ALLOWED_HOSTS: ${PCC_ALLOWED_HOSTS:-}
      PCC_AUTH_DISABLED_ON_NETWORK: ${PCC_AUTH_DISABLED_ON_NETWORK:-}
      # Scoped agent tokens (docs/AGENT_INTEGRATION.md, "Scoped agent tokens"): hashes only; an empty list is valid.
      PCC_AGENT_TOKENS_FILE: /run/secrets/pcc_agent_tokens
    secrets:
      - pcc_token
      - pcc_tls_cert
      - pcc_tls_key
      - pcc_agent_tokens
    volumes:
      - pcc-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('https').get({host:'127.0.0.1',port:8790,path:'/api/session',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  pcc_token:
    file: ${APD_SECRETS_DIR:-./secrets}/pcc_token.txt
  pcc_tls_cert:
    file: ${APD_SECRETS_DIR:-./secrets}/tls_cert.pem
  pcc_tls_key:
    file: ${APD_SECRETS_DIR:-./secrets}/tls_key.pem
  pcc_agent_tokens:
    file: ${APD_SECRETS_DIR:-./secrets}/agent_tokens.json

volumes:
  pcc-data:
